$kind: http-request
description: Reseta a senha usando o token recebido por email.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "token-recebido-por-email",
      "newPassword": "novaSenha123"
    }
auth:
  type: noauth
order: 5000
